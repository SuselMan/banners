<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Сортировка баннеров (временный инструмент)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d0e12;
    color: #f1f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: #9497a6; font-size: 13px; margin: 0 0 20px; }
  .toolbar {
    position: sticky;
    top: 0;
    background: #0d0e12;
    padding: 10px 0 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 10;
    border-bottom: 1px solid #2a2d38;
    margin-bottom: 16px;
  }
  button {
    background: #ff5a5f;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: #1c1f28;
    border: 1px solid #2a2d38;
    color: #f1f2f5;
  }
  #status { font-size: 13px; color: #5ac8ff; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
  }
  .card {
    background: #1c1f28;
    border: 1px solid #2a2d38;
    border-radius: 10px;
    overflow: hidden;
    cursor: grab;
    user-select: none;
  }
  .card.dragging { opacity: 0.35; }
  .card.drag-over { outline: 2px solid #ff5a5f; }
  .card .num {
    position: absolute;
    margin: 6px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
  }
  .thumb {
    aspect-ratio: 4/3;
    background: #0a0b0e;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .placeholder {
    font-size: 12px;
    color: #9497a6;
    text-align: center;
    padding: 8px;
  }
  .info { padding: 8px 10px; font-size: 12px; }
  .info .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .id { color: #9497a6; font-size: 11px; }
  textarea {
    width: 100%;
    height: 240px;
    margin-top: 16px;
    background: #14151b;
    color: #d5eaff;
    border: 1px solid #2a2d38;
    border-radius: 8px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    padding: 10px;
    display: none;
  }
</style>
</head>
<body>
  <h1>Сортировка баннеров — временный инструмент</h1>
  <p class="hint">
    Перетаскивай карточки, чтобы задать нужный порядок. Когда закончишь — нажми
    «Скопировать порядок» и пришли результат обратно. Порядок также сохраняется
    в этом браузере (localStorage), так что можно закрыть вкладку и вернуться.
  </p>
  <div class="toolbar">
    <button id="copy-btn">Скопировать порядок (JSON)</button>
    <button class="secondary" id="reset-btn">Сбросить к исходному</button>
    <span id="status"></span>
  </div>
  <div class="grid" id="grid"></div>
  <textarea id="output" readonly></textarea>

<script>
const DATA_URL = "../data/banners.json";
const BANNERS_BASE = "../assets/banners/";
const STORAGE_KEY = "banner-reorder-draft";

const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const output = document.getElementById("output");

let items = [];
let dragSrcId = null;

function extOf(filename) {
  const m = /\.([a-z0-9]+)$/i.exec(filename || "");
  return m ? m[1].toLowerCase() : "";
}

function render() {
  grid.innerHTML = "";
  items.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.id = item.id;

    const thumb = document.createElement("div");
    thumb.className = "thumb";

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = index + 1;
    thumb.appendChild(num);

    const hasCoverableSrc = item.cover || extOf(item.file) !== "swf";
    if (hasCoverableSrc) {
      const img = document.createElement("img");
      img.alt = item.title;
      img.src = item.cover ? BANNERS_BASE + item.cover : BANNERS_BASE + item.file;
      img.onerror = () => {
        img.remove();
        const ph = document.createElement("div");
        ph.className = "placeholder";
        ph.textContent = item.title;
        thumb.appendChild(ph);
      };
      thumb.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = item.title;
      thumb.appendChild(ph);
    }

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `<div class="title">${item.title}</div><div class="id">#${item.id}</div>`;

    card.appendChild(thumb);
    card.appendChild(info);

    card.addEventListener("dragstart", () => {
      dragSrcId = item.id;
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      document.querySelectorAll(".card.drag-over").forEach((el) => el.classList.remove("drag-over"));
    });
    card.addEventListener("dragover", (e) => {
      e.preventDefault();
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
    card.addEventListener("drop", (e) => {
      e.preventDefault();
      card.classList.remove("drag-over");
      if (dragSrcId === null || dragSrcId === item.id) return;
      const fromIndex = items.findIndex((x) => x.id === dragSrcId);
      const toIndex = items.findIndex((x) => x.id === item.id);
      const [moved] = items.splice(fromIndex, 1);
      items.splice(toIndex, 0, moved);
      save();
      render();
    });

    grid.appendChild(card);
  });
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  statusEl.textContent = "Сохранено в браузере ✓";
  setTimeout(() => { statusEl.textContent = ""; }, 1500);
}

document.getElementById("copy-btn").addEventListener("click", async () => {
  const json = JSON.stringify(items, null, 2);
  output.value = json;
  output.style.display = "block";
  output.select();
  try {
    await navigator.clipboard.writeText(json);
    statusEl.textContent = "Скопировано в буфер обмена ✓";
  } catch (e) {
    statusEl.textContent = "Не удалось скопировать автоматически — выдели текст ниже вручную";
  }
});

document.getElementById("reset-btn").addEventListener("click", () => {
  localStorage.removeItem(STORAGE_KEY);
  fetch(DATA_URL).then((r) => r.json()).then((data) => {
    items = data;
    render();
    statusEl.textContent = "Порядок сброшен к исходному";
  });
});

fetch(DATA_URL)
  .then((r) => r.json())
  .then((data) => {
    const draft = localStorage.getItem(STORAGE_KEY);
    if (draft) {
      try {
        const draftItems = JSON.parse(draft);
        const draftIds = new Set(draftItems.map((x) => x.id));
        const dataIds = new Set(data.map((x) => x.id));
        const sameSet = draftIds.size === dataIds.size && [...draftIds].every((id) => dataIds.has(id));
        items = sameSet ? draftItems : data;
      } catch (e) {
        items = data;
      }
    } else {
      items = data;
    }
    render();
  })
  .catch((err) => {
    grid.innerHTML = `<p style="color:#ff5a5f">Ошибка загрузки: ${err.message}</p>`;
  });
</script>
</body>
</html>
